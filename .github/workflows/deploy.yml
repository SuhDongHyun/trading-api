name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/suhdonghyun/trading-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
    steps:
      - name: SSH 키 설정
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 서버의 git clone에서 compose.yaml을 갱신하고, .env는 서버에만 둔다.
      - name: 새 이미지로 교체
        run: |
          ssh "$OCI_USER@$OCI_HOST" IMAGE_TAG="$GITHUB_SHA" bash -s <<'EOF'
          set -euo pipefail
          cd ~/trading-api
          git fetch --quiet origin main
          git reset --hard origin/main
          docker compose pull --quiet
          # 시작에 실패한 채 남은 컨테이너를 재사용하지 않도록 항상 새로 만든다.
          docker compose up -d --remove-orphans --force-recreate
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:9999/docs && break
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:9999/docs
          docker image prune -f
          EOF
